model:
  default: z-ai/glm-5.3-flashx
  provider: commandcode
  base_url: https://api.commandcode.ai/provider/v1
agent:
  max_turns: 150
  service_tier: fast
  verbose: false
  reasoning_effort: high
terminal:
  backend: local
  cwd: .
  timeout: 180
  home_mode: auto
  container_cpu: 1
  container_memory: 5120
  container_disk: 51200
  container_persistent: true
  docker_mount_cwd_to_workspace: false
  lifetime_seconds: 300
web:
  backend: exa
  use_gateway: false
browser:
  inactivity_timeout: 120
  cloud_provider: local
  use_gateway: false
tool_loop_guardrails:
  warnings_enabled: true
  hard_stop_enabled: false
  warn_after:
    exact_failure: 2
    same_tool_failure: 3
    idempotent_no_progress: 2
  hard_stop_after:
    exact_failure: 5
    same_tool_failure: 8
    idempotent_no_progress: 5
compression:
  enabled: true
  threshold: 0.5
  target_ratio: 0.2
  protect_last_n: 20
  protect_first_n: 3
  codex_gpt55_autoraise: false
prompt_caching:
  cache_ttl: 5m
auxiliary:
  vision:
    provider: openai-codex
    model: gpt-5.6-luna
display:
  compact: false
  busy_input_mode: interrupt
  bell_on_complete: false
  show_reasoning: false
  background_process_notifications: concise
  streaming: true
  skin: omarchy
  interim_assistant_messages: true
  tool_progress: all
  cleanup_progress: false
  long_running_notifications: true
  busy_ack_detail: true
tts:
  provider: kittentts
  use_gateway: false
stt:
  enabled: true
  local:
    model: base
  openai:
    model: whisper-1
memory:
  memory_enabled: true
  user_profile_enabled: true
  memory_char_limit: 4000
  user_char_limit: 1375
  nudge_interval: 10
  flush_min_turns: 6
delegation:
  max_iterations: 250
moa:
  presets:
    default:
      reference_models:
        - provider: openai-codex
          model: gpt-5.6-sol
          enabled: true
        - provider: opencode-go
          model: deepseek-v4-flash
          enabled: true
      degraded_reference_policy: loud
      fanout: user_turn
  reference_models:
    - provider: openai-codex
      model: gpt-5.6-sol
      enabled: true
    - provider: opencode-go
      model: deepseek-v4-flash
      enabled: true
  aggregator:
    provider: openrouter
    model: anthropic/claude-opus-4.8
  degraded_reference_policy: loud
  max_tokens: 4096
  fanout: user_turn
  enabled: true
skills:
  creation_nudge_interval: 15
command_allowlist:
  - execute_code
  - script execution via heredoc
  - script execution via -e/-c flag
  - shell execution via heredoc
plugins:
  enabled:
    - herdr-agent-state
    - image_gen/openai-codex
    - orca-status
    - platforms/discord
    - web/exa
  disabled:
    - browser/browser_use
    - browser/browserbase
    - browser/firecrawl
    - cron_providers/chronos
    - dashboard_auth/basic
    - dashboard_auth/drain
    - dashboard_auth/nous
    - dashboard_auth/self_hosted
    - disk-cleanup
    - google_meet
    - image_gen/deepinfra
    - image_gen/fal
    - image_gen/krea
    - image_gen/meta-ai
    - image_gen/openai
    - image_gen/openrouter
    - image_gen/xai
    - observability/langfuse
    - platforms/a2a
    - platforms/buzz
    - platforms/dingtalk
    - platforms/email
    - platforms/feishu
    - platforms/google_chat
    - platforms/homeassistant
    - platforms/irc
    - platforms/line
    - platforms/matrix
    - platforms/mattermost
    - platforms/ntfy
    - platforms/photon
    - platforms/raft
    - platforms/simplex
    - platforms/slack
    - platforms/sms
    - platforms/teams
    - platforms/telegram
    - platforms/wecom
    - platforms/whatsapp
    - security-guidance
    - spotify
    - teams_pipeline
    - video_gen/deepinfra
    - video_gen/fal
    - video_gen/openrouter
    - video_gen/xai
    - web/brave_free
    - web/ddgs
    - web/firecrawl
    - web/keenable
    - web/parallel
    - web/perplexity
    - web/searxng
    - web/tavily
    - web/xai
code_execution:
  timeout: 300
  max_tool_calls: 50
streaming:
  enabled: false
onboarding:
  seen:
    busy_input_prompt: true
    tool_progress_prompt: true
updates:
  pre_update_backup: quick
  backup_keep: 5
  non_interactive_local_changes: stash
_config_version: 49
session_reset:
  mode: none
  idle_minutes: 1440
  at_hour: 4
group_sessions_per_user: true
platform_toolsets:
  cli:
    - browser
    - clarify
    - code_execution
    - computer_use
    - connections
    - cronjob
    - delegation
    - file
    - image_gen
    - memory
    - session_search
    - skills
    - terminal
    - todo
    - tts
    - vision
    - web
  telegram:
    - hermes-telegram
  discord:
    - hermes-discord
  whatsapp:
    - hermes-whatsapp
  slack:
    - hermes-slack
  signal:
    - hermes-signal
  homeassistant:
    - hermes-homeassistant
  qqbot:
    - hermes-qqbot
  yuanbao:
    - hermes-yuanbao
image_gen:
  provider: openai-codex
  use_gateway: false
  model: gpt-image-2-medium
known_plugin_toolsets:
  cli:
    - spotify
mcp_servers:
  arthub:
    url: https://artifact.sharosoo.com/mcp
    headers:
      Authorization: Bearer ${MCP_ARTHUB_API_KEY}
    enabled: true
telemetry:
  shared_metrics:
    enabled: false
    send: false
