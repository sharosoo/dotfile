# Hermes regenerates PATH without mise shims; systemd cannot append, so this
# restates the generated PATH with ~/.local/share/mise/shims after ~/.local/bin.
# Re-derive it if `hermes gateway install --force` changes the unit's PATH.
[Service]
Environment="PATH=${HOME}/.hermes/hermes-agent/node_modules/.bin:${HOME}/.hermes/tools/node-26.7.0-linux-x64/bin:${HOME}/.hermes/tools/npm-12.0.2-linux-x64/bin:${HOME}/.local/bin:${HOME}/.local/share/mise/shims:${HOME}/.cargo/bin:${HOME}/.npm-global/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
