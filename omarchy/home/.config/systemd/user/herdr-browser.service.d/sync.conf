# One-way sync from the person's Chromium (herdr-browser-sync). History, IndexedDB and extensions can only
# be written while the agent Chromium is down; cookies go in over CDP once it is up. A failed sync logs an
# ERROR line to this unit's journal but does not keep the browser from starting ("-"); the cookie part is
# retried by herdr-browser-sync.service on the next cookie change.
[Service]
ExecStartPre=-%h/.local/bin/herdr-browser-sync offline
ExecStartPost=-%h/.local/bin/herdr-browser-sync cookies --full --wait 60
